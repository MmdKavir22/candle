name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions. No secrets are used. The admin panel (/admin/) commits catalog changes (public/data, public/images) to main, which triggers this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Compute base path and site URL
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${REPO}/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
          fi
      - name: Publish only public data (drop drafts and unexpected files)
        run: npm run prepare:public
      - name: Type check
        run: npm run typecheck
      - name: Validate JSON data
        run: npm run validate:data
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Public values (repository Variables, not Secrets)
          VITE_SITE_REPO: ${{ github.repository }}
          VITE_ORDERS_API_URL: ${{ vars.ORDERS_API_URL }}
          VITE_TELEGRAM_USERNAME: ${{ vars.VITE_TELEGRAM_USERNAME }}
      - name: Leak check (fails the deploy if private data is in the site)
        run: npm run check:leaks
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
