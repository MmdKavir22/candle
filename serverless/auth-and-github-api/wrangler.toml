name = "candle-admin"
main = "worker.ts"
compatibility_date = "2024-09-01"

# Non-secret settings. Edit for your repository.
[vars]
GITHUB_REPO = "USERNAME/REPOSITORY"
ALLOWED_USERS = "your-github-login"
ALLOWED_ORIGIN = "https://USERNAME.github.io"
ADMIN_URL = "https://USERNAME.github.io/REPOSITORY/admin/"
BRANCH = "main"

# Secrets (never put them here). Set with:
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put GITHUB_REPO_TOKEN
