name: Validation

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: TypeScript (orders worker, non-blocking until first verified)
        run: npm run typecheck:worker
        continue-on-error: true
      - name: JSON data validation
        run: npm run validate:data
      - name: Tests
        run: npm test
      - name: Build verification
        run: npm run build
        env:
          BASE_PATH: /candle-store/
          SITE_URL: https://example.github.io/candle-store
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Code quality - no secrets or unsafe patterns in source
        run: |
          if grep -RInE "(ghp_|github_pat_|-----BEGIN [A-Z ]*PRIVATE KEY|client_secret\s*[:=]\s*['\"][A-Za-z0-9])" src public 2>/dev/null; then
            echo "Possible secret committed"; exit 1; fi
          if grep -RInE "(eval\(|new Function\(|document\.write\()" src; then
            echo "Unsafe JS pattern found"; exit 1; fi
